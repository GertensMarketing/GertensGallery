<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gertens Gallery — Launching Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-main:      #7c6f6c;   /* Primary gray-taupe (matches live site bg) */
      --color-bg:         #e6e2e0;  /* Light linen — used for text on dark */
      --color-secondary:  #cfc9c7;  /* Lighter neutral for the eyebrow label */
      --color-accent:     #e6e2e0;  /* Light linen accent for the divider */
      --color-deep:        #170f0c; /* Near-black */

      --font-display: 'Cormorant Garamond', serif;
      --font-body:    'Jost', sans-serif;
    }

    * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background-color: var(--color-main);
      color: var(--color-bg);
      font-family: var(--font-body);
      font-weight: 300;
      overflow: hidden;
    }

    img { display: block; max-width: 100%; }

    /* Page wrapper with brand gradient + subtle noise, echoing the main site's hero treatment */
    #stage {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 90% at 50% 30%, rgba(124,111,108,0.35) 0%, rgba(23,15,12,0.55) 65%, rgba(23,15,12,0.75) 100%);
      z-index: 1;
    }

    #stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      opacity: 0.2;
      z-index: 2;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 0 clamp(24px, 8vw, 100px);
      max-width: 640px;
    }

    #logo-img {
      max-width: clamp(200px, 40vw, 380px);
      max-height: 180px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin: 0 auto 2.75rem;
      display: block;
      opacity: 0;
      animation: fadeUp 1s 0.3s forwards;
    }

    #logo-fallback {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-bg);
      line-height: 1;
      margin: 0 auto 2.75rem;
      opacity: 0;
      animation: fadeUp 1s 0.3s forwards;
      display: none; /* shown only if image fails */
    }

    .divider {
      width: 1px;
      height: 48px;
      margin: 0 auto 2rem;
      background: linear-gradient(to bottom, transparent, var(--color-accent), transparent);
      opacity: 0;
      animation: fadeUp 1s 0.6s forwards;
    }

    .headline {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      letter-spacing: 0.02em;
      color: var(--color-bg);
      opacity: 0;
      animation: fadeUp 1s 0.85s forwards;
    }

    .eyebrow {
      margin-top: 1.6rem;
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.68rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--color-secondary);
      opacity: 0;
      animation: fadeUp 1s 1.1s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #logo-img, #logo-fallback, .divider, .headline, .eyebrow {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <div id="stage">
    <div class="content">
      <img
        id="logo-img"
        src="https://gertensgallery.netlify.app/images/GertensGallery_white.png"
        alt="Gertens Gallery"
        onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';"
      />
      <div id="logo-fallback">Gertens<br />Gallery</div>

      <div class="divider"></div>

      <p class="headline">Website launching soon.</p>
      <p class="eyebrow">Gertens Gallery</p>
    </div>
  </div>

</body>
</html>
